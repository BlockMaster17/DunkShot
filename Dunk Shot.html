<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dunk Shot</title>
<style>
:root{--bg:#1b2a4a;--fg:#fff}
@media (prefers-color-scheme:light){:root{--bg:#1b2a4a;--fg:#fff}}
html,body{height:100%;margin:0;background:#0d1426;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
canvas{display:block;width:100%;height:100%}
#score{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center;color:var(--fg);font-size:64px;font-weight:800;opacity:.9;pointer-events:none}
#pop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 90px);left:0;right:0;text-align:center;color:#ffd24a;font-weight:800;font-size:22px;pointer-events:none;opacity:0;transition:opacity .4s}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,16,34,.78);color:var(--fg);text-align:center;padding:24px}
#ov h1{margin:0;font-size:42px;color:#ff8a2b}
#ov p{margin:0;opacity:.85}
#ov button{margin-top:10px;font-size:20px;font-weight:700;padding:14px 36px;border:0;border-radius:30px;background:#ff8a2b;color:#fff;cursor:pointer}
#ov button.sec{font-size:15px;padding:10px 18px;margin:0 4px;background:rgba(255,255,255,.18)}
.hide{display:none!important}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="score">0</div>
<div id="pop"></div>
<div id="ov">
<h1 id="t">🏀 Dunk Shot</h1>
<p id="m">Ziehe den Ball zurück, ziele und lass los.<br>Triff den nächsten Korb – ohne den Rand zu berühren!</p>
<p id="b"></p>
<button id="go">Spielen</button>
</div>
</div>
<script>
const W=400,G=.34,R=15,HW=44,DEP=58,K=.1,MAXP=145;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const elScore=document.getElementById('score'),pop=document.getElementById('pop'),ov=document.getElementById('ov');
let H=700,S=1,best=0;
try{best=+localStorage.getItem('dunk_best')||0}catch(e){}
function resize(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;S=r.width/W;H=r.height/S;ctx.setTransform(S*d,0,0,S*d,0,0)}
addEventListener('resize',resize);resize();

let bounced=false,maxIdx=0,bgImg=null,trail=[],fr=0,hoops,obs,parts,rings,cur,ball,state,cam,score,streak,clean,over=true,drag=null,popT;
function addHoop(){const p=hoops[hoops.length-1];const dy=120+Math.min(45,hoops.length*1.8)+Math.random()*28;
 let x;do{x=60+Math.random()*(W-120)}while(Math.abs(x-p.x)<90);
 const h={x,y:p.y-dy,a:0,sw:0};hoops.push(h);const n=hoops.length;
 if(n>4&&Math.random()<Math.min(.5,.12+n*.012)){const my=(p.y+h.y)/2,mx=(p.x+h.x)/2,lo=Math.min(p.x,h.x)-35,hi=Math.max(p.x,h.x)+35,ops=['s','m'];
  if(lo>120)ops.push('wl');if(hi<280)ops.push('wr');
  const sx=lo>75?lo-25:(hi<325?hi+25:null);if(sx!==null)ops.push('v','b');
  const k=ops[Math.floor(Math.random()*ops.length)];
  if(k==='wl')obs.push({t:'w',y:my,ax:0,ay:my,bx:90,by:my});
  else if(k==='wr')obs.push({t:'w',y:my,ax:W,ay:my,bx:W-90,by:my});
  else if(k==='s')obs.push({t:'s',y:my,cx:Math.max(70,Math.min(330,mx)),cy:my,len:40,ang:Math.random()*6,spd:(Math.random()<.5?-1:1)*(.012+Math.random()*.012)});
  else if(k==='m')obs.push({t:'m',y:my,x:Math.max(70,Math.min(330,mx)),min:70,max:330,dir:1,sp:.8+Math.random()*.6});
  else if(k==='v')obs.push({t:'v',y:my,ax:sx,ay:my-38,bx:sx,by:my+38});
  else obs.push({t:'b',y:my,x:sx})}}
function reset(){hoops=[{x:W/2,y:0,a:0,sw:0}];obs=[];parts=[];rings=[];trail=[];while(hoops.length<8)addHoop();
 cur=0;maxIdx=0;bounced=false;ball={x:W/2,y:10,vx:0,vy:0,px:0,py:0,rot:0};state='held';cam=-H*.65;score=0;streak=0;clean=true;over=false;elScore.textContent=0}
reset();over=true;

function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S}}
cv.addEventListener('pointerdown',e=>{if(over||state!=='held')return;drag={s:toLogical(e),p:{x:0,y:0},len:0}});
addEventListener('pointermove',e=>{if(!drag)return;const p=toLogical(e);let dx=drag.s.x-p.x,dy=drag.s.y-p.y;const l=Math.hypot(dx,dy);
 if(l>MAXP){dx*=MAXP/l;dy*=MAXP/l}drag.p={x:dx,y:dy};drag.len=Math.min(l,MAXP)});
addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;
 if(d.len<10||state!=='held')return;
 ball.vx=d.p.x*K;ball.vy=d.p.y*K;state='fly';clean=true;bounced=false});

function hw(h,lx,ly){const c=Math.cos(h.a),s=Math.sin(h.a);return{x:h.x+lx*c-ly*s,y:h.y+lx*s+ly*c}}
function toLocal(h,x,y){const dx=x-h.x,dy=y-h.y,c=Math.cos(h.a),s=Math.sin(h.a);return{x:dx*c+dy*s,y:-dx*s+dy*c}}
function simSeg(st,ax,ay,bx,by,rad,bn){const ex=bx-ax,ey=by-ay,l2=ex*ex+ey*ey;let t=l2?((st.x-ax)*ex+(st.y-ay)*ey)/l2:0;t=Math.max(0,Math.min(1,t));
 const px=ax+ex*t,py=ay+ey*t;let dx=st.x-px,dy=st.y-py;const d=Math.hypot(dx,dy);
 if(d<R+rad){if(d<.001){dx=0;dy=-1}else{dx/=d;dy/=d}
  const dot=st.vx*dx+st.vy*dy;if(dot<0){st.vx-=(1+bn)*dot*dx;st.vy-=(1+bn)*dot*dy}
  st.x=px+dx*(R+rad);st.y=py+dy*(R+rad);return true}return false}
function seg(ax,ay,bx,by,rad,bn){if(simSeg(ball,ax,ay,bx,by,rad,bn))clean=false}
function simStep(st){st.vy+=G;st.x+=st.vx;st.y+=st.vy;
 if(st.x<R){st.x=R;st.vx=Math.abs(st.vx)*.8}if(st.x>W-R){st.x=W-R;st.vx=-Math.abs(st.vx)*.8}
 for(const o of obs){if(o.t==='s'||o.t==='m'||Math.abs(o.y-st.y)>90)continue;
  if(o.t==='b')simSeg(st,o.x,o.y,o.x,o.y,16,.8);else simSeg(st,o.ax,o.ay,o.bx,o.by,5,.6)}}
function bowl(t){return[-HW*Math.cos(t)*(1-.6*Math.sin(t)),DEP*Math.sin(t)]}
function hoopCol(h){const L=hw(h,-HW,0),Rr=hw(h,HW,0);
 seg(L.x,L.y,L.x,L.y,4,.4);seg(Rr.x,Rr.y,Rr.x,Rr.y,4,.4)}
function inHoop(h){const a=toLocal(h,ball.px,ball.py),b=toLocal(h,ball.x,ball.y);return a.y<0&&b.y>=0&&Math.abs(b.x)<HW}
function burst(h,big){h.sw=1;rings.push({x:h.x,y:h.y,r:HW,l:1});
 if(!big)return;for(let i=0;i<22;i++){const an=Math.random()*6.283,sp=2+Math.random()*5;parts.push({x:h.x,y:h.y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-2,l:1,c:i%2?'#ffd24a':'#ff8a2b'})}}

function tcol(){if(streak<4)return[210,30,88,0];if(streak<6)return[28+Math.random()*14,100,58,1];if(streak<9)return[Math.random()*45,100,55,1];return[(fr*9+Math.random()*60)%360,100,60,1]}
function step(dt){fr++;
 for(const p of trail){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=.04*dt}trail=trail.filter(p=>p.l>0);
 for(const o of obs){if(o.t==='s')o.ang+=o.spd*dt;else if(o.t==='m'){o.x+=o.dir*o.sp*dt;if(o.x>o.max){o.x=o.max;o.dir=-1}if(o.x<o.min){o.x=o.min;o.dir=1}}}
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.15*dt;p.l-=.025*dt}
 parts=parts.filter(p=>p.l>0);
 for(const r of rings){r.r+=2.6*dt;r.l-=.035*dt}rings=rings.filter(r=>r.l>0);
 hoops.forEach((h,i)=>{h.sw=Math.max(0,h.sw-.03*dt);if(!(i===cur&&state==='held'&&drag&&drag.len>0))h.a*=Math.pow(.86,dt)});
 if(state==='held'){const h=hoops[cur];
  if(drag&&drag.len>0)h.a=Math.atan2(drag.p.x,-drag.p.y);
  const t=hw(h,0,drag&&drag.len>0?12+drag.len*.13:10);ball.x+=(t.x-ball.x)*.4;ball.y+=(t.y-ball.y)*.4;
 }else{
  ball.px=ball.x;ball.py=ball.y;ball.rot+=ball.vx*.04*dt;
  if(streak>1){const n=Math.min(streak,8);for(let i=0;i<n&&trail.length<450;i++)trail.push({x:ball.x+(Math.random()-.5)*6,y:ball.y+(Math.random()-.5)*6,vx:(Math.random()-.5)*1.2-ball.vx*.05,vy:(Math.random()-.5)*1.2-ball.vy*.05-.2,l:1,sz:R*(.45+Math.min(streak,10)*.05)*(.6+Math.random()*.6),c:tcol()})}
  ball.vy+=G*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  if(ball.x<R){ball.x=R;ball.vx=Math.abs(ball.vx)*.8;bounced=true}
  if(ball.x>W-R){ball.x=W-R;ball.vx=-Math.abs(ball.vx)*.8;bounced=true}
  for(const o of obs){if(Math.abs(o.y-ball.y)>90)continue;
   if(o.t==='w'||o.t==='v')seg(o.ax,o.ay,o.bx,o.by,5,.6);
   else if(o.t==='s'){const c=Math.cos(o.ang)*o.len,s=Math.sin(o.ang)*o.len;seg(o.cx-c,o.cy-s,o.cx+c,o.cy+s,5,.6)}
   else if(o.t==='m')seg(o.x-32,o.y,o.x+32,o.y,5,.6);
   else seg(o.x,o.y,o.x,o.y,16,.8)}
  const n=hoops[cur+1],lo=Math.max(0,cur-3),hi=Math.min(hoops.length,cur+5);
  if(ball.vy>0){const ax=n.x-ball.x,ay=n.y-ball.y;if(ay>0&&ay<85&&Math.abs(ax)<HW+15)ball.vx+=ax*.0045*dt}
  for(let i=lo;i<hi;i++)if(Math.abs(hoops[i].y-ball.y)<140)hoopCol(hoops[i]);
  let ci=-1;for(let i=lo;i<hi;i++){const sy=hoops[i].y-cam;if(sy>-40&&sy<H+40&&inHoop(hoops[i])){ci=i;break}}
  if(ci>=0){const h=hoops[ci];state='held';ball.vx=ball.vy=0;
   if(ci>maxIdx){let pts=1+(ci-maxIdx-1);const tx=[];
    if(clean){streak++;pts+=streak;tx.push(streak>1?'🔥 Combo x'+streak:'Perfekt!')}else streak=0;
    if(bounced){pts+=2;tx.push('Bande +2')}
    if(ci-maxIdx>1)tx.push('Übersprungen');
    maxIdx=ci;score+=pts;elScore.textContent=score;elScore.animate([{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:300,easing:'ease-out'});
    burst(h,true);
    if(tx.length){pop.textContent=tx.join(' · ')+'  +'+pts;pop.style.opacity=1;pop.animate([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:250})}else pop.style.opacity=0;
   }else{streak=0;pop.style.opacity=0;burst(h,false)}
   cur=ci;while(hoops.length<cur+8)addHoop()}
  if(ball.y>cam+H+30)end();
 }
 const target=hoops[cur].y-H*.65;cam+=(target-cam)*.08*dt;
}
function end(){over=true;if(score>best){best=score;try{localStorage.setItem('dunk_best',best)}catch(e){}}
 document.getElementById('t').textContent='Spiel vorbei';
 document.getElementById('m').textContent='Punkte: '+score;
 document.getElementById('b').textContent='Highscore: '+best;
 document.getElementById('go').textContent='Nochmal';ov.classList.remove('hide')}
document.getElementById('go').addEventListener('click',()=>{reset();ov.classList.add('hide')});

{const im=new Image();im.onload=()=>{bgImg=im};im.src=BG}
document.getElementById('b').textContent=best?'Highscore: '+best:'';

function netPath(){ctx.beginPath();for(let i=0;i<=20;i++){const b=bowl(i/20*Math.PI);i?ctx.lineTo(b[0],b[1]):ctx.moveTo(b[0],b[1])}ctx.closePath()}
function drawHoop(h,front){
 ctx.save();ctx.translate(h.x,h.y-cam);ctx.rotate(h.a);ctx.lineCap='round';const fl=h.sw>.4;
 if(!front){ctx.save();ctx.scale(1-.15*h.sw,1+.4*h.sw);netPath();ctx.fillStyle='rgba(255,255,255,.12)';ctx.fill();ctx.restore();
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,0,HW,9,0,0,7);ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=fl?'#fff':'#c23a10';ctx.beginPath();ctx.ellipse(0,0,HW,9,0,Math.PI,2*Math.PI);ctx.stroke()}
 else{ctx.save();ctx.scale(1-.15*h.sw,1+.4*h.sw);netPath();ctx.save();ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.6;ctx.beginPath();
  for(let x=-88;x<=88;x+=22){ctx.moveTo(x,0);ctx.lineTo(x*.3+40,DEP);ctx.moveTo(x,0);ctx.lineTo(x*.3-40,DEP)}ctx.stroke();ctx.restore();
  ctx.lineWidth=2;ctx.strokeStyle='#fff';netPath();ctx.stroke();ctx.restore();
  ctx.lineWidth=7;ctx.strokeStyle=fl?'#fff':'#ff5a1f';ctx.beginPath();ctx.ellipse(0,0,HW,9,0,0,Math.PI);ctx.stroke();
  ctx.fillStyle=fl?'#fff':'#ff5a1f';for(const sx of[-HW,HW]){ctx.beginPath();ctx.arc(sx,0,4.5,0,7);ctx.fill()}}
 ctx.restore()}
function draw(){
 ctx.clearRect(0,0,W,H);
 if(bgImg){const k=Math.max(W/bgImg.width,H/bgImg.height),w=bgImg.width*k,hh=bgImg.height*k;ctx.drawImage(bgImg,(W-w)/2,(H-hh)/2,w,hh);ctx.fillStyle='rgba(8,14,30,.1)';ctx.fillRect(0,0,W,H)}
 else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#27406e');g.addColorStop(1,'#1b2a4a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
 ctx.lineCap='round';
 for(const o of obs){const y=o.y-cam;if(y<-90||y>H+90)continue;ctx.lineWidth=10;
  if(o.t==='w'||o.t==='v'){ctx.strokeStyle='#e6ecf5';ctx.beginPath();ctx.moveTo(o.ax,o.ay-cam);ctx.lineTo(o.bx,o.by-cam);ctx.stroke()}
  else if(o.t==='s'){const c=Math.cos(o.ang)*o.len,s=Math.sin(o.ang)*o.len;ctx.strokeStyle='#ff4f6d';ctx.beginPath();ctx.moveTo(o.cx-c,o.cy-s-cam);ctx.lineTo(o.cx+c,o.cy+s-cam);ctx.stroke();
   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(o.cx,o.cy-cam,4,0,7);ctx.fill()}
  else if(o.t==='m'){ctx.strokeStyle='#ffb02e';ctx.beginPath();ctx.moveTo(o.x-32,y);ctx.lineTo(o.x+32,y);ctx.stroke()}
  else{ctx.fillStyle='#5ad1ff';ctx.beginPath();ctx.arc(o.x,y,16,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke()}}
 for(const h of hoops){const y=h.y-cam;if(y<-60||y>H+80)continue;drawHoop(h,false)}
  if(drag&&drag.len>0&&state==='held'){const st={x:ball.x,y:ball.y,vx:drag.p.x*K,vy:drag.p.y*K};ctx.fillStyle='rgba(255,255,255,.65)';
  for(let i=0;i<66;i++){simStep(st);if(i%3===2){ctx.beginPath();ctx.arc(st.x,st.y-cam,Math.max(1,3.2-i*.035),0,7);ctx.fill()}}}
 const bx=ball.x,by=ball.y-cam;
 for(const p of trail){const c=p.c,al=Math.max(0,p.l);ctx.globalCompositeOperation=c[3]?'lighter':'source-over';
  ctx.fillStyle='hsla('+c[0]+','+c[1]+'%,'+c[2]+'%,'+al*.55+')';ctx.beginPath();ctx.arc(p.x,p.y-cam,Math.max(.5,p.sz*(c[3]?al:.5+(1-al))),0,7);ctx.fill()}
 ctx.globalCompositeOperation='source-over';
 if(streak>1){const ar=R*(1.7+Math.min(streak,10)*.12),c=tcol(),gr=ctx.createRadialGradient(bx,by,R*.5,bx,by,ar);
  gr.addColorStop(0,'hsla('+c[0]+','+c[1]+'%,'+c[2]+'%,.5)');gr.addColorStop(1,'hsla('+c[0]+','+c[1]+'%,'+c[2]+'%,0)');
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(bx,by,ar,0,7);ctx.fill()}
 ctx.save();ctx.translate(bx,by);ctx.rotate(ball.rot);
 const bg=ctx.createRadialGradient(-R*.35,-R*.4,R*.1,0,0,R);bg.addColorStop(0,'#ff8a2a');bg.addColorStop(.75,'#f7741a');bg.addColorStop(1,'#e0600c');
 ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();
 ctx.save();ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.clip();
 ctx.strokeStyle='#2a1004';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(-R,0);ctx.lineTo(R,0);ctx.moveTo(0,-R);ctx.lineTo(0,R);ctx.stroke();
 ctx.beginPath();ctx.arc(-R*1.3,0,R,-.85,.85);ctx.stroke();ctx.beginPath();ctx.arc(R*1.3,0,R,Math.PI-.85,Math.PI+.85);ctx.stroke();ctx.restore();
 ctx.strokeStyle='#2a1004';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();ctx.restore();
 ctx.fillStyle='rgba(255,255,255,.16)';ctx.beginPath();ctx.ellipse(bx-R*.35,by-R*.4,R*.3,R*.18,-.6,0,7);ctx.fill();
 for(const h of hoops){const y=h.y-cam;if(y<-60||y>H+80)continue;drawHoop(h,true)}
 for(const r of rings){ctx.strokeStyle='rgba(255,210,74,'+r.l+')';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(r.x,r.y-cam,r.r,r.r*.35,0,0,7);ctx.stroke()}
 for(const p of parts){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y-cam,3,0,7);ctx.fill()}ctx.globalAlpha=1;
}
let last=performance.now();
function loop(t){const dt=Math.min((t-last)/16.67,2);last=t;if(!over)step(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
